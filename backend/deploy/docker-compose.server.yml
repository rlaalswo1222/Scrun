# 팀 공용 개발 서버(계획 0019). 서버의 이 폴더에서:
#   cp .env.server.example .env   # 값 채우기(git에 안 올림)
#   ./update.sh develop           # 빌드 → 마이그레이션 → 실행
# 밖으로는 Caddy의 80·443만 열린다. DB는 컨테이너끼리만.
name: scrun

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrun
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에}
      POSTGRES_DB: scrun
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: # 서버 journald로(계획 0087 3단계: Loki로 모아 검색). 앱 서비스의 &app_logging과 같은 값(앵커가 아래라 직접 적음)
      driver: journald
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrun"]
      interval: 3s
      retries: 30

  # 계획 0073: 같은 이미지를 셋으로 띄운다. Caddy(Caddyfile)가 경로로 나눔
  #   api      일반 API. uvicorn 프로세스 2개(코어 수). 허브는 REALTIME_URL로 실시간 프로세스에 물음(app/realtime/link.py)
  #   realtime WebSocket /v1/realtime + 허브 + 허브 내부 API. 방 상태가 메모리라 하나만
  #   ocr      계기판 사진 인증만. 읽기 프로세스 2개를 이 프로세스 하나만 띄움(api가 여럿이어도 OCR은 둘)
  # DB 연결은 프로세스마다 풀 15 → 합계 60(api 2 × 15 + realtime 15 + ocr 15), Postgres 기본 한도 100 안
  api:
    build: ..
    image: scrun-app:local
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--workers", "2"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://scrun:${DB_PASSWORD}@db:5432/scrun
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에}
      KAKAO_MODE: real # 공개 서버라 고정. fake면 아무나 아무 계정으로 로그인됨
      KAKAO_APP_ID: ${KAKAO_APP_ID:?KAKAO_APP_ID를 .env에}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-} # 계정 삭제·연결 끊기 웹훅(계획 0058). 없으면 그 둘만 503(서버는 뜸)
      VERIFY_OCR_TIMEOUT_S: ${VERIFY_OCR_TIMEOUT_S:-15} # 읽기 시간 제한(초). 실사진이 15초를 넘겨 .env로 잠시 늘려 잼(11/19, 계획 0055)
      OCR_ENGINE: none
      REALTIME_URL: http://realtime:8000
      # 번호표(계획 0071)는 프로세스마다 → api 2개 × 6 = 12. 12 × 2 = 24는 DB에 너무 몰려 200명 처리량 229/초·p95 0.7초,
      # 6 × 2는 283/초·p95 0.5초(0073 측정). realtime·ocr은 아래에서 12로 되돌림. tests/test_config.py가 합계를 봄
      ADMISSION_LIMIT: 6
      # 서버 오류를 Sentry로(계획 0087, ADR-0015). DSN은 .env(git 밖), 비우면 안 보냄. 릴리스 = 배포한 커밋(update.sh가 넘김)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${SCRUN_RELEASE:-}
      SCRUN_SERVICE: api
      # 지표(계획 0087 2단계): uvicorn 프로세스마다 이 폴더에 적고 /metrics가 합침. 아래 tmpfs라 컨테이너가 뜰 때마다 비어 있음
      PROMETHEUS_MULTIPROC_DIR: /run/scrun-metrics
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-} # Grafana 알람 → /internal/alerts → Sentry. 비우면 그 주소는 404
    tmpfs: &metrics_tmpfs
      - /run/scrun-metrics
    logging: &app_logging # 배포(update.sh)가 컨테이너를 새로 만들어도 로그가 남게(11/19 첫 OCR 실패 로그를 잃음, 계획 0055).
      driver: journald # 보기: docker logs scrun-api-1(이번 컨테이너) / journalctl CONTAINER_NAME=scrun-api-1 --since "1 hour ago"(지난 것까지)
    depends_on:
      db:
        condition: service_healthy
    healthcheck: &app_health # DB까지 거치는 약관 API로 확인. 헤더가 있으면 요청 로그에 안 남김(계획 0070)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/v1/agreements', headers={'X-Scrun-Probe': '1'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  realtime:
    image: scrun-app:local # api가 빌드한 이미지(따로 빌드하지 않음)
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *app_env
      REALTIME_URL: "" # 허브를 갖는 쪽
      ADMISSION_LIMIT: 12
      SCRUN_SERVICE: realtime
    tmpfs: *metrics_tmpfs
    logging: *app_logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *app_health

  ocr:
    image: scrun-app:local
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *app_env
      OCR_ENGINE: onnx # 계기판 OCR 진짜 엔진(계획 0046): 읽기 프로세스 2개, 사진 3장 15초 제한
      ADMISSION_LIMIT: 12
      SCRUN_SERVICE: ocr
    tmpfs: *metrics_tmpfs
    logging: *app_logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *app_health

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS를 .env에}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    logging: *app_logging # 서버 journald로(계획 0087 3단계)
    depends_on: # api만 건강하면 뜸. realtime·ocr이 안 떠도 그 경로만 502이고 나머지 API는 됨(계획 0073 리뷰)
      api:
        condition: service_healthy
      realtime:
        condition: service_started
      ocr:
        condition: service_started

  # ---------- 지표·대시보드·알람(계획 0087 2단계, ADR-0015) ----------
  # 밖으로 여는 포트 없음. Grafana만 서버 안 127.0.0.1:3000 → 노트북에서 SSH 터널(backend/README.md "감시")
  # 메모리 상한은 첫 값(가설): 실제 쓰는 양을 대시보드 "컨테이너별 메모리"로 보고 고침
  alloy:
    image: grafana/alloy:v1.21.3
    hostname: scrun-alloy # 지표의 instance 라벨. 없으면 컨테이너를 다시 만들 때마다 바뀌어 같은 지표가 새 줄로 생김(11/28 로컬 시험)
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD} # Postgres 수집기(config.alloy)
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      # 서버 CPU·메모리·디스크(읽기 전용)
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # 컨테이너별 CPU·메모리(cAdvisor): 컨테이너 이름을 알려고 Docker 소켓. 읽기 전용으로 붙여도 Docker API는 다 부를 수 있어
      # 사실상 서버 관리자 권한 → 이 컨테이너는 밖에 안 열고 이미지 판을 고정함
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro # 새 Docker는 컨테이너 이름을 containerd로 찾음
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # daily.sh가 쓰는 마지막 백업 시각(*.prom). update.sh가 폴더를 먼저 만듦(없으면 Docker가 root 소유로 만들어 daily.sh가 못 씀)
      - ${HOME}/scrun-metrics:/scrun-metrics:ro
      # 컨테이너 로그(3단계): 서버 journald를 읽음. machine-id로 이 서버의 journal 폴더를 찾음
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 384m
    logging: *app_logging
    depends_on: [prometheus, loki]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 768m
    logging: *app_logging

  loki:
    image: grafana/loki:3.7.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    mem_limit: 512m
    logging: *app_logging

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 서버 안에서만. 노트북: ssh -L 3000:localhost:3000 ... → http://localhost:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에(서버에서 token_urlsafe로)}
      GF_AUTH_ANONYMOUS_ENABLED: "true" # 보기는 로그인 없이(터널이 곧 잠금, 11/28 민재). 고치기는 admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn # 자기 요청 기록(INFO)이 Loki를 채우지 않게(계획 0087 3단계 배포 뒤)
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?ALERT_WEBHOOK_TOKEN을 .env에(서버에서 token_urlsafe로)} # 알람 연락처(provisioning/alerting)
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    mem_limit: 512m # 로컬 시험에서 켜자마자 343 MiB(11/28)
    logging: *app_logging
    depends_on: [prometheus, loki]

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  alloydata:
  promdata:
  grafanadata:
  lokidata:
