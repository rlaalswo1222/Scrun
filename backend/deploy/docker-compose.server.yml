# 팀 공용 개발 서버(계획 0019). 서버의 이 폴더에서:
#   cp .env.server.example .env   # 값 채우기(git에 안 올림)
#   ./update.sh develop           # 빌드 → 마이그레이션 → 실행
# 밖으로는 Caddy의 80·443만 열린다. DB는 컨테이너끼리만.
name: scrun

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrun
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에}
      POSTGRES_DB: scrun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrun"]
      interval: 3s
      retries: 30

  api:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://scrun:${DB_PASSWORD}@db:5432/scrun
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에}
      KAKAO_MODE: real # 공개 서버라 고정. fake면 아무나 아무 계정으로 로그인됨
      KAKAO_APP_ID: ${KAKAO_APP_ID:?KAKAO_APP_ID를 .env에}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-} # 계정 삭제·연결 끊기 웹훅(계획 0058). 없으면 그 둘만 503(서버는 뜸)
      OCR_ENGINE: onnx # 계기판 OCR 진짜 엔진(계획 0046): 읽기 프로세스 2개, 사진 3장 15초 제한
      VERIFY_OCR_TIMEOUT_S: ${VERIFY_OCR_TIMEOUT_S:-15} # 읽기 시간 제한(초). 실사진이 15초를 넘겨 .env로 잠시 늘려 잼(11/19, 계획 0055)
    logging: # 배포(update.sh)가 컨테이너를 새로 만들어도 로그가 남게(11/19 첫 OCR 실패 로그를 잃음, 계획 0055).
      driver: journald # 보기: docker logs scrun-api-1(이번 컨테이너) / journalctl CONTAINER_NAME=scrun-api-1 --since "1 hour ago"(지난 것까지)
    depends_on:
      db:
        condition: service_healthy
    healthcheck: # DB까지 거치는 약관 API로 확인
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/agreements', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS를 .env에}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddydata:
  caddyconfig:
