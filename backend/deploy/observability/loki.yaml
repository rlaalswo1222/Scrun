# 로그 저장(계획 0087 3단계, ADR-0015). Alloy가 서버 journald의 컨테이너 로그를 보내고 Grafana가 검색한다.
# 한 프로세스(single binary)·파일 저장. 보관 30일(접속 IP·기록 ID가 든 주소가 남아서 길게 두지 않음).
# 밖에 안 엶(compose 네트워크 안에서만, Alloy·Grafana가 부름)
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h          # 30일
  max_query_lookback: 720h
  ingestion_rate_mb: 4            # 평소 시간당 약 5천 줄(11/28). 넘치면 Alloy가 다시 보냄
  ingestion_burst_size_mb: 8
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true         # 30일 지난 것을 실제로 지움
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

analytics:
  reporting_enabled: false
