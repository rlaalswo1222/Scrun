# 서버 로그(journald) 보관 상한(계획 0087 1단계). 컨테이너 로그가 journald로 쌓인다(docker-compose.server.yml logging).
# 11/27 1.6 GB 사용·디스크 96 GB 중 20 GB → 상한 4 GB(디스크가 가득 차 DB가 멈추는 일을 막음). 넘으면 오래된 것부터 지움
# 서버에 넣기(한 번, 바꾸면 다시):
#   sudo mkdir -p /etc/systemd/journald.conf.d && sudo cp journald-scrun.conf /etc/systemd/journald.conf.d/scrun.conf
#   sudo systemctl restart systemd-journald && journalctl --disk-usage
[Journal]
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=10G
